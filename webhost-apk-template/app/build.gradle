plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.webhost.wrapper'
    compileSdk 34

    defaultConfig {
        applicationId "com.webhost.wrapper"
        minSdk 21
        targetSdk 34
        // versionCode/versionName are placeholders — the WebHost server
        // never rebuilds this app, it only patches assets/webhost_config.json
        // into the compiled APK afterwards, so these don't need to change.
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Debug builds are auto-signed by Gradle's built-in debug
            // keystore, so the APK produced by CI is already installable —
            // no separate signing step needed for this template.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
